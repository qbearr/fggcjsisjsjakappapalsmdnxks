name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Checkout pool
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: published
          fetch-depth: 0
        continue-on-error: true

      - name: Install dependencies
        run: bun install

      - name: Plan releases
        run: |
          mkdir -p published/pool
          bun run plan-releases -- --pool published/pool --out plan.json || true

      - name: Build plugins
        run: bun run build

      - name: Generate index
        run: |
          bun run generate-index -- --pool published/pool --out published/index.json \
            --base-url https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: published
          keep_files: true
